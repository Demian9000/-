  <h1 style="color: #14264d; text-align: center;">Мұхтар Әуезов</h1>
  <p style="font-size:18px; color: #333333;">Мұхтар Әуезов (1897-1961) — жазушы, драматург, ғалым, «Абай жолы» роман-эпопеясының авторы.</p>
  <p style="font-size:18px; color: #333333;">Ол Семей өңірінде, Шыңғыстау баурайында дүниеге келген.</p>
  <h2 style="color: #a50044;">Негізгі шығармалары</h2>
  <ul>
  <li style="color:#555555;">«Абай жолы»</li>
  <li style="color:#555555;">«Қараш-Қараш оқиғасы»</li>
  <li style="color:#555555;">«Көксерек»</li>
  </ul>
  </body>
